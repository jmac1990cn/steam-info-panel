name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含前导 v），例如 1.0.9'
        required: true
        default: '1.0.9'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本并确保 tag（仅手动触发）
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
            TAG="v${VER}"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG"
              git push origin "$TAG"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 将版本号写入 manifest
        # 注意：Chrome 扩展的 manifest.version 只接受「数字+点」（如 1.1.3），不允许 -beta/-rc 等后缀。
        # 因此把 tag 版本号净化成纯数字再写入 manifest（beta/rc 仅作为发布渠道，体现在 tag/Release 名上）。
        run: |
          RAW="${{ steps.meta.outputs.version }}"
          SAFE=$(echo "$RAW" | sed -E 's/[-+].*$//; s/[^0-9.]//g')
          if [ -z "$SAFE" ]; then SAFE="0.0.0"; fi
          echo "manifest version (sanitized from '$RAW') = $SAFE"
          python3 - "$SAFE" <<'PY'
          import json, sys
          v = sys.argv[1]
          with open('manifest.json', 'r', encoding='utf-8') as f:
              m = json.load(f)
          m['version'] = v
          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: 打包为 zip（排除开发产物）
        run: |
          VER="${{ steps.meta.outputs.version }}"
          rm -rf _pkg && mkdir -p _pkg/steam-info-panel
          rsync -a --exclude='.git' --exclude='.github' --exclude='backup' \
            --exclude='dist' --exclude='DEVLOG.md' --exclude='*.pem' \
            --exclude='_pkg' ./ _pkg/steam-info-panel/
          (cd _pkg && zip -r "../steam-info-panel-${VER}.zip" steam-info-panel/)
          ls -lh "steam-info-panel-${VER}.zip"

      - name: 生成 CRX（需 CRX_PRIVATE_KEY secret，保持固定扩展 ID）
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "未配置 CRX_PRIVATE_KEY secret，跳过 CRX 生成"
            exit 0
          fi
          pip install crx3 >/dev/null 2>&1
          printf '%s' "$CRX_PRIVATE_KEY" > key.pem
          crx3 create -pk key.pem -o "./steam-info-panel-${{ steps.meta.outputs.version }}.crx" "_pkg/steam-info-panel"
          ls -lh "steam-info-panel-${{ steps.meta.outputs.version }}.crx"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Steam 游戏速查面板 v${{ steps.meta.outputs.version }}
          prerelease: ${{ contains(steps.meta.outputs.version, 'beta') || contains(steps.meta.outputs.version, 'alpha') || contains(steps.meta.outputs.version, 'rc') }}
          body: |
            ## Steam 游戏速查面板 v${{ steps.meta.outputs.version }}（正式版）

            ### 本次更新
            - **功能 7 弹窗体验修复**：此前「Steam Deck 不支持」和「帧率样本仍在统计」两类游戏，
              自动打开的「了解更多」弹窗要等满 9 秒超时才关闭；有帧率的游戏反而几百毫秒就拿到数字。
              现在只取弹窗容器内文本：明确写出不支持 / 统计中的状态文案连续两轮命中，
              或报告主体渲染完且文本稳定仍无数字，就立即关窗（典型 0.5–1.5 秒，兜底超时从 9s 缩到 5s）。
            - **无帧率结论缓存 6 小时**：面板明确显示「不支持」或「统计中」，期间再访问该游戏不再弹窗；
              点「重新检测」可立即复查。有帧率数值仍缓存 24 小时。
            - **手动回填更可靠**：用户手动点开弹窗读到帧率会自动回填并刷新缓存、清掉负结论；
              修复手动按钮在无帧率时可能把结果当成 FPS 回填的问题。
            - 未锁定弹窗容器时（Steam 改版）放长渲染宽限，避免把慢渲染的有帧率页面误判为无帧率。
            - 其余功能不变：史低价格统一走 ITAD（v1.1.6 起已移除 CheapShark），Epic 免费速查沿用 ITAD 赠送记录。

            ### 安装方式
            - **CRX（固定扩展 ID，推荐用于覆盖更新）**：下载 `steam-info-panel-${{ steps.meta.outputs.version }}.crx` 拖入浏览器扩展页；扩展 ID 与旧版相同，会自动覆盖更新。
            - **ZIP 侧载**：下载 `steam-info-panel-${{ steps.meta.outputs.version }}.zip` 解压，在 `chrome://extensions` 开启「开发者模式」→「加载已解压的扩展程序」，选中解压出的 `steam-info-panel` 文件夹。
            - 装好后请点面板「重新检测」清除缓存。

            ### 关于史低数据
            史低价格现在只使用 ITAD（Steam 国区 `storeLow`），需在面板「⚙ 设置」或扩展选项页填入自己的
            免费 API key（申请：https://isthereanydeal.com/apps/my/）。未配置 key 时，面板改用每次访问记录的
            「本地观测最低价」作为参考，不再请求任何第三方史低接口。

            > 仓库源码内不含 `.pem` 打包私钥；CRX 由 CI 使用仓库 Secrets 中的私钥现生成，私钥不进入代码仓库。
          files: steam-info-panel-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 追加 CRX 到 Release（如已生成）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "未配置 CRX_PRIVATE_KEY，无 CRX 可追加"
            exit 0
          fi
          gh release upload "${{ steps.meta.outputs.tag }}" "steam-info-panel-${{ steps.meta.outputs.version }}.crx" --repo "${{ github.repository }}"
